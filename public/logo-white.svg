<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100" role="img" aria-label="Dhalahore Properties">
  <defs>
    <linearGradient id="goldRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c85c"/>
      <stop offset="55%" stop-color="#f2bb46"/>
      <stop offset="100%" stop-color="#c9961f"/>
    </linearGradient>
  </defs>

  <!-- House icon -->
  <g transform="translate(8, 12)">
    <!-- Roof -->
    <path d="M 38 2 L 74 30 L 2 30 Z" fill="url(#goldRoof)" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Chimney -->
    <path d="M 60 6 L 60 14 L 68 20.5 L 68 6 Z" fill="#1a1a1a"/>
    <!-- House body -->
    <rect x="6" y="30" width="64" height="46" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Door -->
    <rect x="29" y="44" width="18" height="32" rx="1.5" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="43.5" cy="61" r="2" fill="#1a1a1a"/>
    <!-- Left window -->
    <rect x="12.5" y="38" width="10" height="10" rx="1" fill="none" stroke="#c9961f" stroke-width="2.5"/>
    <!-- Right window -->
    <rect x="53.5" y="38" width="10" height="10" rx="1" fill="none" stroke="#c9961f" stroke-width="2.5"/>
  </g>

  <!-- Wordmark -->
  <text x="98" y="56" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-1.2">Dhalahore</text>

  <!-- Subtext -->
  <text x="101" y="82" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#c9961f" letter-spacing="6.2">PROPERTIES</text>
</svg>
