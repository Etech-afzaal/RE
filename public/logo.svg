<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40" viewBox="0 0 120 40" role="img" aria-label="Dhalahore Properties">
  <defs>
    <linearGradient id="brassgradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9812c"/>
      <stop offset="100%" stop-color="#8a6a22"/>
    </linearGradient>
  </defs>
  
  <rect width="120" height="40" fill="none"/>
  
  <!-- House icon with brass gradient -->
  <g transform="translate(6, 5)">
    <!-- Roof -->
    <path d="M 12 1 L 22 9 L 2 9 Z" fill="url(#brassgradient)" stroke="#1a1a1a" stroke-width="1.2" stroke-linejoin="round"/>
    
    <!-- House body -->
    <rect x="2" y="9" width="20" height="13" rx="1" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" stroke-linejoin="round"/>
    
    <!-- Door -->
    <rect x="9" y="13" width="6" height="9" rx="0.5" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="14.5" cy="18" r="0.6" fill="#1a1a1a"/>
    
    <!-- Left window -->
    <rect x="4" y="11" width="3" height="3" rx="0.3" fill="none" stroke="url(#brassgradient)" stroke-width="0.8"/>
    
    <!-- Right window -->
    <rect x="17" y="11" width="3" height="3" rx="0.3" fill="none" stroke="url(#brassgradient)" stroke-width="0.8"/>
  </g>
  
  <!-- Text: Dhalahore -->
  <text x="35" y="18" font-family="Manrope, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#1a1a1a" letter-spacing="-0.5">Dhalahore</text>
  
  <!-- Subtext: Properties -->
  <text x="35" y="30" font-family="IBM Plex Mono, monospace" font-size="7" font-weight="600" fill="#a9812c" letter-spacing="1">PROPERTIES</text>
</svg>


