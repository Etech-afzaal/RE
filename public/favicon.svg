<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Dhalahore Properties">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9812c"/>
      <stop offset="100%" stop-color="#8a6a22"/>
    </linearGradient>
  </defs>
  
  <rect width="32" height="32" fill="#fafaf9" rx="4"/>
  
  <!-- House icon -->
  <g transform="translate(4, 4)">
    <!-- Roof -->
    <path d="M 12 2 L 22 11 L 2 11 Z" fill="url(#fg)" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round"/>
    
    <!-- House body -->
    <rect x="2" y="11" width="20" height="14" rx="1" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round"/>
    
    <!-- Door -->
    <rect x="9" y="15" width="6" height="10" rx="0.5" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
    <circle cx="14.5" cy="21" r="0.5" fill="#1a1a1a"/>
    
    <!-- Left window -->
    <rect x="4" y="13" width="3" height="3" rx="0.3" fill="none" stroke="url(#fg)" stroke-width="0.6"/>
    
    <!-- Right window -->
    <rect x="17" y="13" width="3" height="3" rx="0.3" fill="none" stroke="url(#fg)" stroke-width="0.6"/>
  </g>
</svg>
