<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fgbig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9812c"/>
      <stop offset="100%" stop-color="#8a6a22"/>
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" fill="#fafaf9" rx="8"/>
  
  <!-- House icon -->
  <g transform="translate(8, 8)">
    <!-- Roof -->
    <path d="M 24 4 L 44 22 L 4 22 Z" fill="url(#fgbig)" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- House body -->
    <rect x="4" y="22" width="40" height="28" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Door -->
    <rect x="18" y="30" width="12" height="20" rx="1" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="29" cy="42" r="1" fill="#1a1a1a"/>
    
    <!-- Left window -->
    <rect x="8" y="26" width="6" height="6" rx="0.5" fill="none" stroke="url(#fgbig)" stroke-width="1"/>
    
    <!-- Right window -->
    <rect x="34" y="26" width="6" height="6" rx="0.5" fill="none" stroke="url(#fgbig)" stroke-width="1"/>
  </g>
</svg>
